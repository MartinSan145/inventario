<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Timbrados</title>

    <!-- Bootswatch -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/pulse/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet"
          th:href="@{/css/vetshop.css}">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
        }
        .table thead th {
            background-color: #593196;
            color: #fff;
        }
    </style>


</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-custom">

    <div class="container-fluid px-4">


        <!-- LOGO -->

        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/menu}">

            <img src="/img/loogo.PNG"
                 alt="VETSHOP - Dra. Sheila Sánchez"
                 class="logo-navbar">


            <span class="system-name">

                Gestión Veterinaria

            </span>

        </a>


        <!-- USUARIO -->

        <div class="user-info">

            <i class="bi bi-person-circle"></i>

            <span>Administrador</span>


            <!-- MENÚ -->

            <a th:href="@{/menu}"
               class="btn btn-sm btn-vet-outline ms-2">

                <i class="bi bi-house"></i>

                <span>Menú</span>

            </a>


            <!-- SALIR -->

            <a th:href="@{/logout}"
               class="btn btn-sm btn-vet-outline">

                <i class="bi bi-box-arrow-right"></i>

                <span>Salir</span>

            </a>

        </div>

    </div>

</nav>

<main class="main-container">


    <!-- =================================================
         ENCABEZADO
         ================================================= -->

    <div class="page-header">


        <div>

            <h2 class="page-title">

                <i class="bi bi-box-seam"></i>

                Timbrados

            </h2>


            <p class="page-subtitle">

                Administra los timbrados
                de VETSHOP.

            </p>

        </div>


        <a th:href="@{/timbrado/nuevo}"
           class="btn btn-vet">

            <i class="bi bi-plus-circle"></i>

            Nuevo timbrado

        </a>

    </div>



    <!-- =================================================
         TARJETA PRODUCTOS
         ================================================= -->

    <div class="card product-card">


        <!-- HEADER -->

        <div class="product-card-header">

            <h5>

                <i class="bi bi-list-ul"></i>

                Lista de Timbrados

            </h5>


            <span>

                <i class="bi bi-box"></i>

            </span>

        </div>


        <!-- BODY -->

        <div class="card-body p-0">


            <!-- TABLA -->

            <div class="table-container">

                <table class="table table-hover align-middle">


                <tr>
                    <th>N° Timbrado</th>
                    <th>Cod. Establecimiento</th>
                    <th>Expedicion</th>
                    <th>Inicio Vigencia</th>
                    <th>Fin Vigencia</th>
                    <th>Desde</th>
                    <th>Hasta</th>
                    <th>Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="timbrado : ${timbrado}">
                    <td th:text="${timbrado.nro_timbrado}"></td>
                    <td th:text="${timbrado.cod_establecimiento}"></td>
                    <td th:text="${timbrado.expedicion}"></td>
                    <td th:text="${timbrado.inicio_vigencia}"></td>
                    <td th:text="${timbrado.fin_vigencia}"></td>
                    <td th:text="${timbrado.desde}"></td>
                    <td th:text="${timbrado.hasta}"></td>
                    <td th:text="${timbrado.estado}"></td>
                    <td class="text-center">

                        <a th:href="@{/timbrado/editar/{id}(id=${timbrado.id})}"
                           class="btn btn-sm btn-warning me-1">
                            <i class="bi bi-pencil-square"></i>
                        </a>

                        <a th:href="@{/timbrado/{id}(id=${timbrado.id})}"
                           class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </a>

                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
