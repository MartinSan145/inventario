<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/pulse/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-box-seam"></i> Sistema
        </a>

        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link active">
                    <i class="bi bi-pencil-square"></i> Editar Producto
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/productos">
                    <i class="bi bi-list-ul"></i> Lista
                </a>
            </li>
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">
            <div class="card">

                <div class="card-header bg-warning">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil"></i> Editar Producto
                    </h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/productos/{id}(id=${producto.id})}"
                          th:object="${producto}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Producto</label>
                            <input type="text" th:field="*{descripcion}"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio Venta</label>
                            <input type="number" th:field="*{precio_venta}"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio Compra</label>
                            <input type="number" th:field="*{precio_compra}"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" th:field="*{stock}"
                                   class="form-control" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" th:field="*{categoria.id}">
                                <option value="">-- Seleccione --</option>
                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.descripcion}">
                                </option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button class="btn btn-warning">
                                <i class="bi bi-save"></i> Actualizar
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
