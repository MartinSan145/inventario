<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>

    <!-- Bootswatch -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/pulse/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
        }
        .table thead th {
            background-color: #593196;
            color: #fff;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-box-seam"></i> Sistema
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarColor01">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarColor01">
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        <i class="bi bi-list-ul"></i> Productos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/productos/nuevo">
                        <i class="bi bi-plus-circle"></i> Nuevo
                    </a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#">
                        <i class="bi bi-gear"></i> Mantenimiento
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Categoría</a></li>
                        <li><a class="dropdown-item" href="#">Proveedor</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a  class="dropdown-item"  href="/login">Salir</a></li>
                    </ul>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-5">

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <i class="bi bi-box"></i> Lista de Productos
            </h4>
        </div>

        <div class="card-body">

            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Descripción</th>
                    <th>Precio Venta</th>
                    <th>Precio Compra</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.descripcion}"></td>
                    <td th:text="${producto.precio_venta}"></td>
                    <td th:text="${producto.precio_compra}"></td>
                    <td th:text="${producto.stock}"></td>
                    <td th:text="${producto.categoria.descripcion}"></td>
                    <td class="text-center">

                        <a th:href="@{/productos/editar/{id}(id=${producto.id})}"
                           class="btn btn-sm btn-warning me-1">
                            <i class="bi bi-pencil-square"></i>
                        </a>

                        <a th:href="@{/productos/{id}(id=${producto.id})}"
                           class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </a>

                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
