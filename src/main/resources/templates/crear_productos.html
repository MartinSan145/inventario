<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>

    <!-- Bootswatch -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/pulse/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-box-seam"></i> Sistema
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active">
                        <i class="bi bi-plus-circle"></i> Nuevo Producto
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/productos">
                        <i class="bi bi-list-ul"></i> Lista
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- FORM -->
<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">
            <div class="card">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-box-arrow-in-down"></i> Registro de Producto
                    </h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/productos}" th:object="${producto}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Producto</label>
                            <input type="text" th:field="*{descripcion}"
                                   class="form-control" placeholder="Ingrese el producto" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio Venta</label>
                            <input type="number" th:field="*{precio_venta}"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio Compra</label>
                            <input type="number" th:field="*{precio_compra}"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" th:field="*{stock}"
                                   class="form-control" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" th:field="*{categoria.id}">
                                <option value="">-- Seleccione --</option>
                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.descripcion}">
                                </option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button class="btn btn-success">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
