<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>

    <!-- Bootswatch -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/pulse/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/vetshop.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-custom">

    <div class="container-fluid px-4">


        <!-- LOGO -->

        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/menu}">

            <img src="/img/loogo.PNG"
                 alt="VETSHOP - Dra. Sheila Sánchez"
                 class="logo-navbar">


            <span class="system-name">

                Gestión Veterinaria

            </span>

        </a>


        <!-- USUARIO -->

        <div class="user-info">

            <i class="bi bi-person-circle"></i>

            <span>Administrador</span>


            <!-- MENÚ -->

            <a th:href="@{/menu}"
               class="btn btn-sm btn-vet-outline ms-2">

                <i class="bi bi-house"></i>

                <span>Menú</span>

            </a>


            <!-- SALIR -->

            <a th:href="@{/logout}"
               class="btn btn-sm btn-vet-outline">

                <i class="bi bi-box-arrow-right"></i>

                <span>Salir</span>

            </a>

        </div>

    </div>

</nav>

<!-- FORM -->
<div class="product-form-container">

    <div class="product-form-card">

        <div class="product-form-header">
            <i class="bi bi-box-arrow-in-down"></i> Registro de Clientes

        </div>

        <div class="product-form-body">

        <form th:action="@{/clientes}" th:object="${clientes}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}"
                                   class="form-control" placeholder="Ingrese el nombre" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{apellido}"
                                   class="form-control" placeholder="Ingrese el nombre" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Telefono</label>
                            <input type="number" th:field="*{telefono}"
                                   class="form-control" placeholder="Ingrese el telefono" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ruc</label>
                            <input type="number" th:field="*{ruc}"
                                   class="form-control" placeholder="Ingrese su ruc" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="text" th:field="*{email}"
                                   class="form-control" placeholder="Ingrese el Email" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Ciudad</label>
                            <select class="form-select" th:field="*{ciudad.id}">
                                <option value="">-- Seleccione --</option>
                                <option th:each="cli : ${ciudad}"
                                        th:value="${cli.id}"
                                        th:text="${cli.descripcion}">
                                </option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button class="btn btn-success">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
