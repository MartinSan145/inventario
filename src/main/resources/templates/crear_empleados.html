
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuevo Empleado</title>

    <!-- Bootswatch -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/pulse/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- CSS propio -->
    <link rel="stylesheet"
          th:href="@{/css/vetshop.css}">

</head>


<body>


<!-- ===================================================== -->
<!-- NAVBAR -->
<!-- ===================================================== -->

<nav class="navbar navbar-custom">

    <div class="container-fluid px-4">


        <!-- LOGO -->

        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/menu}">

            <img src="/img/loogo.PNG"
                 alt="VETSHOP - Dra. Sheila Sánchez"
                 class="logo-navbar">

            <span class="system-name">
                Gestión Veterinaria
            </span>

        </a>


        <!-- USUARIO -->

        <div class="user-info">

            <i class="bi bi-person-circle"></i>

            <span>Administrador</span>


            <!-- MENÚ -->

            <a th:href="@{/menu}"
               class="btn btn-sm btn-vet-outline ms-2">

                <i class="bi bi-house"></i>

                <span>Menú</span>

            </a>


            <!-- SALIR -->

            <a th:href="@{/logout}"
               class="btn btn-sm btn-vet-outline">

                <i class="bi bi-box-arrow-right"></i>

                <span>Salir</span>

            </a>

        </div>

    </div>

</nav>


<!-- ===================================================== -->
<!-- FORMULARIO -->
<!-- ===================================================== -->

<div class="product-form-container">

    <div class="product-form-card">


        <!-- CABECERA -->

        <div class="product-form-header">

            <i class="bi bi-person-badge"></i>

            Registro de Empleados

        </div>


        <!-- CUERPO -->

        <div class="product-form-body">


            <form th:action="@{/empleado}"
                  th:object="${empleado}"
                  method="post">


                <!-- ================================================= -->
                <!-- FILA 1 -->
                <!-- ================================================= -->

                <div class="row g-3">


                    <!-- NOMBRE -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input type="text"
                               th:field="*{nombre}"
                               class="form-control"
                               placeholder="Ingrese el nombre"
                               maxlength="20"
                               required>

                    </div>


                    <!-- APELLIDO -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Apellido
                        </label>

                        <input type="text"
                               th:field="*{apellido}"
                               class="form-control"
                               placeholder="Ingrese el apellido"
                               maxlength="20"
                               required>

                    </div>


                </div>


                <!-- ================================================= -->
                <!-- FILA 2 -->
                <!-- ================================================= -->

                <div class="row g-3 mt-1">


                    <!-- CÉDULA -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Cédula
                        </label>

                        <input type="number"
                               th:field="*{cedula}"
                               class="form-control"
                               placeholder="Ingrese la cédula"
                               required>

                    </div>


                    <!-- CORREO -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email"
                               th:field="*{correo}"
                               class="form-control"
                               placeholder="Ingrese el correo electrónico"
                               maxlength="50"
                               required>

                    </div>


                </div>


                <!-- ================================================= -->
                <!-- FILA 3 -->
                <!-- ================================================= -->

                <div class="row g-3 mt-1">


                    <!-- DIRECCIÓN -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Dirección
                        </label>

                        <input type="text"
                               th:field="*{direccion}"
                               class="form-control"
                               placeholder="Ingrese la dirección"
                               maxlength="50"
                               required>

                    </div>


                    <!-- CIUDAD -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Ciudad
                        </label>

                        <select class="form-select"
                                th:field="*{ciudad.id}"
                                required>

                            <option value="">
                                -- Seleccione una ciudad --
                            </option>

                            <option th:each="ciu : ${ciudad}"
                                    th:value="${ciu.id}"
                                    th:text="${ciu.descripcion}">
                            </option>

                        </select>

                    </div>


                </div>


                <!-- ================================================= -->
                <!-- BOTONES -->
                <!-- ================================================= -->

                <div class="d-flex justify-content-end gap-2 mt-4">


                    <!-- CANCELAR -->

                    <a th:href="@{/empleados}"
                       class="btn btn-secondary">

                        <i class="bi bi-x-circle"></i>

                        Cancelar

                    </a>


                    <!-- GUARDAR -->

                    <button type="submit"
                            class="btn btn-success">

                        <i class="bi bi-save"></i>

                        Guardar

                    </button>


                </div>


            </form>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
