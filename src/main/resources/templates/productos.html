<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Productos | VETSHOP</title>


    <!-- =====================================================
         BOOTSWATCH
         ===================================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/pulse/bootstrap.min.css">
    <link rel="stylesheet"
          th:href="@{/css/vetshop.css}">

    <!-- =====================================================
         BOOTSTRAP ICONS
         ===================================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">



</head>


<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-custom">

    <div class="container-fluid px-4">


        <!-- LOGO -->

        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/menu}">

            <img src="/img/loogo.PNG"
                 alt="VETSHOP - Dra. Sheila Sánchez"
                 class="logo-navbar">


            <span class="system-name">

                Gestión Veterinaria

            </span>

        </a>


        <!-- USUARIO -->

        <div class="user-info">

            <i class="bi bi-person-circle"></i>

            <span>Administrador</span>


            <!-- MENÚ -->

            <a th:href="@{/menu}"
               class="btn btn-sm btn-vet-outline ms-2">

                <i class="bi bi-house"></i>

                <span>Menú</span>

            </a>


            <!-- SALIR -->

            <a th:href="@{/logout}"
               class="btn btn-sm btn-vet-outline">

                <i class="bi bi-box-arrow-right"></i>

                <span>Salir</span>

            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
     CONTENIDO
     ===================================================== -->

<main class="main-container">


    <!-- =================================================
         ENCABEZADO
         ================================================= -->

    <div class="page-header">


        <div>

            <h2 class="page-title">

                <i class="bi bi-box-seam"></i>

                Productos

            </h2>


            <p class="page-subtitle">

                Administra los productos y medicamentos
                de VETSHOP.

            </p>

        </div>


        <!-- NUEVO PRODUCTO -->

        <a th:href="@{/productos/nuevo}"
           class="btn btn-vet">

            <i class="bi bi-plus-circle"></i>

            Nuevo producto

        </a>

    </div>



    <!-- =================================================
         TARJETA PRODUCTOS
         ================================================= -->

    <div class="card product-card">


        <!-- HEADER -->

        <div class="product-card-header">

            <h5>

                <i class="bi bi-list-ul"></i>

                Lista de Productos

            </h5>


            <span>

                <i class="bi bi-box"></i>

            </span>

        </div>


        <!-- BODY -->

        <div class="card-body p-0">


            <!-- TABLA -->

            <div class="table-container">

                <table class="table table-hover align-middle">


                    <thead>

                    <tr>

                        <th>
                            Descripción
                        </th>

                        <th>
                            Precio Venta
                        </th>

                        <th>
                            Precio Compra
                        </th>

                        <th>
                            Stock
                        </th>

                        <th>
                            Categoría
                        </th>

                        <th class="text-center">
                            Acciones
                        </th>

                    </tr>

                    </thead>


                    <tbody>


                    <!-- PRODUCTOS -->

                    <tr th:each="producto : ${productos}">


                        <!-- DESCRIPCIÓN -->

                        <td>

                            <strong th:text="${producto.descripcion}">
                            </strong>

                        </td>


                        <!-- PRECIO VENTA -->

                        <td class="price">

                            <span th:text="${producto.precio_venta}">
                            </span>

                        </td>


                        <!-- PRECIO COMPRA -->

                        <td>

                            <span th:text="${producto.precio_compra}">
                            </span>

                        </td>


                        <!-- STOCK -->

                        <td class="stock">

                            <span th:text="${producto.stock}">
                            </span>

                        </td>


                        <!-- CATEGORÍA -->

                        <td>

                            <span th:text="${producto.categoria.descripcion}">
                            </span>

                        </td>


                        <!-- ACCIONES -->

                        <td class="text-center">


                            <!-- EDITAR -->

                            <a th:href="@{/productos/editar/{id}(id=${producto.id})}"
                               class="btn btn-action btn-edit me-1"
                               title="Editar producto">

                                <i class="bi bi-pencil-square"></i>

                            </a>


                            <!-- ELIMINAR -->

                            <a th:href="@{/productos/{id}(id=${producto.id})}"
                               class="btn btn-action btn-delete"
                               title="Eliminar producto">

                                <i class="bi bi-trash"></i>

                            </a>


                        </td>


                    </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>


</main>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer>

    <strong>VETSHOP</strong>

    · Dra. Sheila Sánchez

    · Gestión Veterinaria

    &copy; 2026

</footer>



<!-- =====================================================
     BOOTSTRAP JS
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
