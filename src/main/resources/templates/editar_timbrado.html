<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<!-- Bootswatch -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/pulse/bootstrap.min.css">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

<style>
    body {
        background-color: #f4f6f9;
    }
    .card {
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-box-seam"></i> Sistema
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/productos">
                        <i class="bi bi-list-ul"></i> Lista
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-arrow-left-circle-fill"></i>
                        Volver
                    </a>
                </li>
            </ul>
        </div>
    </div>

</nav>





    <!-- Formulario -->
    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0">
                <i class="bi bi-file-earmark-text me-2"></i>
                Datos del Timbrado
            </h5>

        </div>

        <div class="card-body p-4">
            <form th:action="@{/timbrado/{id}(id=${timbrado.id})}"
                  th:object="${timbrado}" method="post">

                <!-- Datos principales -->
                <div class="row g-3">
                    <input type="hidden" value="1" th:field="*{id}">
                    <!-- Nro Timbrado -->
                    <div class="col-md-4">
                        <label for="nroTimbrado" class="form-label fw-semibold">
                            Nro. Timbrado
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-upc-scan"></i>
                            </span>
                            <input type="text" th:field="*{nro_timbrado}"
                                   class="form-control"
                                   id="nroTimbrado"
                                   name="nroTimbrado"
                                   placeholder="Ej: 80012345"
                                   required>
                        </div>
                    </div>

                    <!-- Establecimiento -->
                    <div class="col-md-4">
                        <label for="establecimiento" class="form-label fw-semibold">
                            Establecimiento
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-building"></i>
                            </span>
                            <input type="text"
                                   class="form-control"
                                   id="establecimiento" th:field="*{cod_establecimiento}"
                                   name="establecimiento"
                                   placeholder="Ej: 001"
                                   required>
                        </div>
                    </div>

                    <!-- Expedición -->
                    <div class="col-md-4">
                        <label for="expedicion" class="form-label fw-semibold">
                            Expedición
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-geo-alt"></i>
                            </span>
                            <input type="text"
                                   class="form-control"
                                   id="expedicion" th:field="*{expedicion}"
                                   name="expedicion"
                                   placeholder="Ej: 001"
                                   required>
                        </div>
                    </div>


                    <!-- Inicio Vigencia -->
                    <div class="col-md-6">
                        <label for="inicioVigencia" class="form-label fw-semibold">
                            Inicio de Vigencia
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-calendar-event"></i>
                            </span>
                            <input type="date"
                                   class="form-control"
                                   id="inicioVigencia" th:field="*{inicio_vigencia}"
                                   name="inicioVigencia"
                                   required>
                        </div>
                    </div>

                    <!-- Fin Vigencia -->
                    <div class="col-md-6">
                        <label for="finVigencia" class="form-label fw-semibold">
                            Fin de Vigencia
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-calendar-check"></i>
                            </span>
                            <input type="date"
                                   class="form-control"
                                   id="finVigencia" th:field="*{fin_vigencia}"
                                   name="finVigencia"
                                   required>
                        </div>
                    </div>


                    <!-- Desde -->
                    <div class="col-md-6">
                        <label for="desde" class="form-label fw-semibold">
                            Desde
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-arrow-down-circle"></i>
                            </span>
                            <input type="number"
                                   class="form-control"
                                   id="desde" th:field="*{desde}"
                                   name="desde"
                                   placeholder="Ej: 1"
                                   min="1"
                                   required>
                        </div>
                        <small class="text-muted">
                            Primer número del rango autorizado.
                        </small>
                    </div>


                    <!-- Hasta -->
                    <div class="col-md-6">
                        <label for="hasta" class="form-label fw-semibold">
                            Hasta
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-arrow-up-circle"></i>
                            </span>
                            <input type="number"
                                   class="form-control"
                                   id="hasta" th:field="*{hasta}"
                                   name="hasta"
                                   placeholder="Ej: 1000"
                                   min="1"
                                   required>
                        </div>
                        <small class="text-muted">
                            Último número del rango autorizado.
                        </small>
                    </div>


                    <!-- Estado -->
                    <div class="col-md-6">
                        <label for="estado" class="form-label fw-semibold">
                            Estado
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-toggle-on"></i>
                            </span>

                            <select class="form-select"
                                    id="estado" th:field="*{estado}"
                                    name="estado"
                                    required>
                                <option value="">Seleccione un estado</option>
                                <option value="ACTIVO">Activo</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                        </div>
                    </div>

                </div>


                <!-- Separador -->
                <hr class="my-4">


                <div class="d-flex justify-content-end">
                    <button class="btn btn-warning">
                        <i class="bi bi-save"></i> Actualizar
                    </button>
                </div>
            </form>

        </div>
    </div>

</div>
</body>
</html>
